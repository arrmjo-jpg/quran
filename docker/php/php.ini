; Platform PHP settings — kept in the repository, not in a developer's shell.
;
; WHY THIS FILE EXISTS. Until it was added the container loaded no php.ini at
; all ("Loaded Configuration File: (none)"), so every value was PHP's compiled
; default, including memory_limit = 128M. The test suite crossed that ceiling
; at roughly 1100 tests and died with a fatal error while Pest wrote its result
; cache — after the tests themselves had run, which makes it look like a pass
; until you read the exit code (255) and notice there is no summary line.
;
; That would have failed CI as well, not only local runs: the pipeline executes
; `docker exec quran_platform_app php artisan test` inside this image, so the
; runner's own PHP settings never applied.
;
; A single long-lived process running the whole suite accumulates, so the
; requirement grows with the test count. This is set with headroom rather than
; at the measured edge, because the alternative is rediscovering the same fatal
; error every few stories.

memory_limit = 512M
