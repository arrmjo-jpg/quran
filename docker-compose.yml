version: '3.8'

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: quran-platform-app:latest
    container_name: quran_platform_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: quran_platform
      DB_USERNAME: quran_user
      DB_PASSWORD: quran_secret_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: file
      MEILISEARCH_HOST: http://meilisearch:7700
      SCOUT_DRIVER: meilisearch
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    networks:
      - quran_network

  nginx:
    image: nginx:1.25-alpine
    container_name: quran_platform_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - quran_network

  mysql:
    image: mysql:8.0
    container_name: quran_platform_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: quran_platform
      MYSQL_USER: quran_user
      MYSQL_PASSWORD: quran_secret_password
    ports:
      - "3306:3306"
    volumes:
      - quran_mysql_data:/var/lib/mysql
      # Creates quran_platform_test and grants quran_user on it. MYSQL_DATABASE
      # above only ever made the dev schema; the test schema was a manual step
      # nothing in the repository performed. Runs on first init of the volume.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - quran_network

  redis:
    image: redis:7.2-alpine
    container_name: quran_platform_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - quran_redis_data:/data
    networks:
      - quran_network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: quran_platform_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: master_key_quran_platform
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - quran_meili_data:/meili_data
    networks:
      - quran_network

  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: quran_platform_horizon
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: quran_platform
      DB_USERNAME: quran_user
      DB_PASSWORD: quran_secret_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      - app
      - redis
      - mysql
    networks:
      - quran_network

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: quran_platform_scheduler
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - app
      - redis
    networks:
      - quran_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: quran_platform_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - quran_network

  frontend-admin:
    build:
      context: ./frontend-admin
    container_name: quran_platform_frontend_admin
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-admin:/app
      - frontend_admin_node_modules:/app/node_modules
    networks:
      - quran_network
    depends_on:
      - app

networks:
  quran_network:
    driver: bridge

volumes:
  quran_mysql_data:
  quran_redis_data:
  quran_meili_data:
  frontend_admin_node_modules:
