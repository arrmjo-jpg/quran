name: CI

on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]

jobs:
  gates:
    name: Functional & Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, sqlite3, redis, gd, intl, zip, bcmath, pcntl, posix
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The .env file (just a copy, no PHP involved yet) must exist before
      # "composer install": its post-autoload-dump hook runs
      # "artisan package:discover", which boots the app and calls
      # ModuleServiceProvider -> ModuleDiscovery::discover(). That method
      # only skips its Cache::remember() path when app()->isLocal() is
      # true, which needs APP_ENV=local from .env to already be in place
      # — without it, config('app.env') falls back to config/app.php's
      # 'production' default and the early bootstrap crashes trying to
      # resolve the cache binding before it exists.
      - name: Create backend .env
        working-directory: backend
        run: cp .env.example .env

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Needs vendor/autoload.php, so must run after composer install.
      - name: Generate app key
        working-directory: backend
        run: php artisan key:generate

      # MUST run before the stack starts. The frontend-admin service mounts a
      # named volume at /app/node_modules inside a bind mount of this checkout,
      # so starting it makes Docker create frontend-admin/node_modules on the
      # runner as root — and npm ci then runs as `runner` and fails EACCES.
      # Installing first means the directory already exists, owned correctly.
      - name: Install frontend-admin dependencies
        working-directory: frontend-admin
        run: npm ci

      # docker-compose's "app" service environment block overrides these
      # for the running container regardless of what's in .env; this only
      # needs to satisfy Laravel's own boot requirements (APP_KEY, etc).
      - name: Start platform stack
        run: docker compose up -d --build

      - name: Wait for the app container to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec quran_platform_app php artisan --version >/dev/null 2>&1; then
              echo "App container ready."
              exit 0
            fi
            echo "Waiting for app container... ($i/30)"
            sleep 2
          done
          echo "App container did not become ready in time."
          docker compose logs app
          exit 1

      - name: Run functional gate
        working-directory: frontend-admin
        run: npm run gate:functional

      - name: Run security gate
        working-directory: frontend-admin
        run: npm run gate:security

      # THE WHOLE SUITE, not a list of files.
      #
      # Until now CI ran `gate:security`, which names seven test files — 43
      # tests of the 1000-odd in the repository, about 4%. Every module suite,
      # every architecture guard and every feature test an epic added ran only
      # on developers' machines, so a pull request could be green here while
      # breaking anything outside those seven files.
      #
      # The security gate above is kept rather than folded into this one: it
      # writes its own artifact, and "the security tests passed" is a claim
      # worth being able to make on its own.
      - name: Run full test suite gate
        working-directory: frontend-admin
        run: npm run gate:suite

      - name: Regenerate release manifest
        working-directory: frontend-admin
        run: npm run manifest:generate

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-artifacts
          path: frontend-admin/artifacts/

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs
